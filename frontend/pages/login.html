<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar | Blog de Expertos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/register.css">
</head>
<body>
  <main class="register-page">
    <section class="brand-panel" aria-label="Bienvenida a Blog de Expertos">
      <a class="brand" href="../index.html"><span class="brand-dot"></span>Blog de Expertos</a>
      <div class="brand-message">
        <h1>Qué bueno verte de nuevo.</h1>
        <p>Ingresa para seguir escribiendo, revisar tus borradores y responder a tus lectores.</p>
      </div>
      <blockquote class="quote-card">
        <p>“Publiqué mi primer artículo en una tarde.”</p>
        <footer>Sofía Reyes · La Cocina de Sofía</footer>
      </blockquote>
    </section>
    <section class="form-panel">
      <div class="register-card login-card">
        <h2>Ingresar</h2>
        <p class="subtitle">Usa el correo con el que te registraste.</p>
        <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>
        <form id="loginForm" novalidate>
          <div class="form-field">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="ana@unah.hn" autocomplete="email" required>
            <div class="invalid-feedback" id="emailFeedback"></div>
          </div>
          <div class="form-field">
            <label for="password" class="form-label">Contraseña</label>
            <div class="password-wrap">
              <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
              <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
            <div class="invalid-feedback" id="passwordFeedback"></div>
          </div>
          <button type="submit" class="btn btn-primary register-button" id="submitButton">Ingresar</button>
        </form>
        <p class="login-link">¿No tienes cuenta? <a href="register.html">Crea una gratis</a></p>
      </div>
    </section>
  </main>
  <script type="module" src="../js/modules/auth/login.js"></script>
</body>
</html>
